name: Deploy Container App

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-container-app.yml"
      - ".github/workflows/ci.yml"
      - "app/**"
      - "frontend/**"
      - "usecases_media/**"
      - "infra/**"
      - "scripts/wait-for-container-app.sh"
      - "scripts/smoke-test-container-app.sh"
      - ".github/dependabot.yml"
      - "SECURITY.md"
      - "docs/**"
      - "tests/**"
      - "Dockerfile"
      - ".dockerignore"
      - "pyproject.toml"
      - "requirements-dev.txt"
      - "requirements-dev.lock"
      - "requirements.txt"
      - "requirements.lock"
  workflow_dispatch:
    inputs:
      deploy_infra:
        description: "Deploy or update Azure infrastructure before publishing the app image"
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-container-app-${{ github.repository }}
  cancel-in-progress: false

env:
  AZURE_LOCATION:              ${{ vars.AZURE_LOCATION || 'swedencentral' }}
  # App resource group (spoke) — shared hub resources stay in RG-AI-DEMO
  RESOURCE_GROUP_NAME:         ${{ vars.RESOURCE_GROUP_NAME || 'RG-AI-DEMO-APP1' }}
  SHARED_RESOURCE_GROUP_NAME:  ${{ vars.SHARED_RESOURCE_GROUP_NAME || 'RG-AI-DEMO' }}
  CONTAINER_REGISTRY_NAME:     ${{ vars.CONTAINER_REGISTRY_NAME || 'acr66fb' }}
  CONTAINER_APP_NAME:          ${{ vars.CONTAINER_APP_NAME || 'ca-foundry-chat' }}
  CONTAINER_APPS_ENV_ID:       ${{ vars.CONTAINER_APPS_ENV_ID }}
  FOUNDRY_PROJECT_ENDPOINT:    ${{ vars.FOUNDRY_PROJECT_ENDPOINT }}
  FOUNDRY_HOSTED_AGENT_NAME:   ${{ vars.FOUNDRY_HOSTED_AGENT_NAME }}
  FOUNDRY_ACCOUNT_NAME:        ${{ vars.FOUNDRY_ACCOUNT_NAME || 'aifoundrydemo66fb' }}
  FOUNDRY_MODELS:              ${{ vars.FOUNDRY_MODELS }}
  FOUNDRY_EMBEDDING_MODEL:     ${{ vars.FOUNDRY_EMBEDDING_MODEL || 'text-embedding-3-small' }}
  FOUNDRY_REALTIME_MODEL:      ${{ vars.FOUNDRY_REALTIME_MODEL || 'gpt-realtime-2.1' }}
  AZURE_SPEECH_ENDPOINT:       ${{ vars.AZURE_SPEECH_ENDPOINT }}
  AZURE_STORAGE_CONTAINER_NAME: ${{ vars.AZURE_STORAGE_CONTAINER_NAME }}
  AZURE_SEARCH_INDEX_NAME:     ${{ vars.AZURE_SEARCH_INDEX_NAME || 'foundry-document-rag' }}
  AZURE_COSMOS_ACCOUNT_NAME:   ${{ vars.AZURE_COSMOS_ACCOUNT_NAME || 'aifoundrydemo66fbcosmosdb' }}
  AZURE_COSMOS_DATABASE_NAME:  ${{ vars.AZURE_COSMOS_DATABASE_NAME || 'apps-db-shared' }}
  AZURE_COSMOS_CONTAINER_NAME: ${{ vars.AZURE_COSMOS_CONTAINER_NAME || 'foundry-chat-app' }}
  ENABLE_ENTRA_AUTHENTICATION: ${{ vars.ENABLE_ENTRA_AUTHENTICATION || 'true' }}
  ENTRA_AUTH_CLIENT_ID:        ${{ vars.ENTRA_AUTH_CLIENT_ID }}
  ENTRA_AUTH_TENANT_ID:        ${{ vars.ENTRA_AUTH_TENANT_ID || vars.AZURE_TENANT_ID }}
  IMAGE_NAME: foundry-chat-app

jobs:
  quality:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: quality
    runs-on: [self-hosted, Linux, X64, foundry-demo-app]

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Azure login
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Configure Azure CLI extensions
        run: az config set extension.use_dynamic_install=yes_without_prompt

      - name: Resolve registry and current image
        id: deployment
        run: |
          LOGIN_SERVER=$(az acr show \
            --resource-group "${{ env.SHARED_RESOURCE_GROUP_NAME }}" \
            --name "${{ env.CONTAINER_REGISTRY_NAME }}" \
            --query loginServer \
            --output tsv)
          PREVIOUS_IMAGE=$(az containerapp show \
            --resource-group "${{ env.RESOURCE_GROUP_NAME }}" \
            --name "${{ env.CONTAINER_APP_NAME }}" \
            --query properties.template.containers[0].image \
            --output tsv 2>/dev/null || true)
          echo "login_server=$LOGIN_SERVER" >> "$GITHUB_OUTPUT"
          echo "previous_image=$PREVIOUS_IMAGE" >> "$GITHUB_OUTPUT"
          echo "image=$LOGIN_SERVER/${{ env.IMAGE_NAME }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build and push immutable image
        run: |
          az acr build \
            --registry "${{ env.CONTAINER_REGISTRY_NAME }}" \
            --image "${{ env.IMAGE_NAME }}:${{ github.sha }}" \
            .

      - name: Ensure app resource group exists
        if: ${{ github.event_name == 'push' || inputs.deploy_infra }}
        run: |
          az group create \
            --name "${{ env.RESOURCE_GROUP_NAME }}" \
            --location "${{ env.AZURE_LOCATION }}" \
            --output none

      - name: Wait for active Container App operation
        if: ${{ github.event_name == 'push' || inputs.deploy_infra }}
        run: bash scripts/wait-for-container-app.sh

      - name: Deploy infrastructure
        if: ${{ github.event_name == 'push' || inputs.deploy_infra }}
        env:
          ENTRA_AUTH_CLIENT_SECRET: ${{ secrets.ENTRA_AUTH_CLIENT_SECRET }}
        run: |
          if [ "${{ env.ENABLE_ENTRA_AUTHENTICATION }}" != "true" ]; then
            echo "Azure deployment requires ENABLE_ENTRA_AUTHENTICATION=true." >&2
            exit 1
          fi
          if [ -z "${{ env.ENTRA_AUTH_CLIENT_ID }}" ] || [ -z "${{ env.ENTRA_AUTH_TENANT_ID }}" ] || [ -z "$ENTRA_AUTH_CLIENT_SECRET" ]; then
            echo "Azure deployment requires Entra client ID, tenant ID, and client secret." >&2
            exit 1
          fi
          az deployment group create \
            --resource-group "${{ env.RESOURCE_GROUP_NAME }}" \
            --name "foundry-chat-app-infra" \
            --template-file infra/main-app-only.bicep \
            --parameters infra/main-app-only.bicepparam \
            --parameters \
              sharedResourceGroupName="${{ env.SHARED_RESOURCE_GROUP_NAME }}" \
              containerAppsEnvironmentId="${{ env.CONTAINER_APPS_ENV_ID }}" \
              foundryAccountName="${{ env.FOUNDRY_ACCOUNT_NAME }}" \
              foundryProjectEndpoint="${{ env.FOUNDRY_PROJECT_ENDPOINT }}" \
              foundryHostedAgentName="${{ env.FOUNDRY_HOSTED_AGENT_NAME }}" \
              foundryModels="${{ env.FOUNDRY_MODELS }}" \
              foundryEmbeddingModel="${{ env.FOUNDRY_EMBEDDING_MODEL }}" \
              foundryRealtimeModel="${{ env.FOUNDRY_REALTIME_MODEL }}" \
              azureSpeechEndpoint="${{ env.AZURE_SPEECH_ENDPOINT }}" \
              storageContainerName="${{ env.AZURE_STORAGE_CONTAINER_NAME }}" \
              searchIndexName="${{ env.AZURE_SEARCH_INDEX_NAME }}" \
              cosmosAccountName="${{ env.AZURE_COSMOS_ACCOUNT_NAME }}" \
              cosmosDatabaseName="${{ env.AZURE_COSMOS_DATABASE_NAME }}" \
              cosmosContainerName="${{ env.AZURE_COSMOS_CONTAINER_NAME }}" \
              enableEntraAuthentication="${{ env.ENABLE_ENTRA_AUTHENTICATION }}" \
              entraAuthenticationClientId="${{ env.ENTRA_AUTH_CLIENT_ID }}" \
              entraAuthenticationClientSecret="$ENTRA_AUTH_CLIENT_SECRET" \
              entraAuthenticationTenantId="${{ env.ENTRA_AUTH_TENANT_ID }}" \
              containerAppName="${{ env.CONTAINER_APP_NAME }}" \
              containerImage="${{ steps.deployment.outputs.image }}" \
            --output table

      - name: Update Container App image
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.deploy_infra }}
        run: |
          bash scripts/wait-for-container-app.sh

          az containerapp update \
            --resource-group "${{ env.RESOURCE_GROUP_NAME }}" \
            --name "${{ env.CONTAINER_APP_NAME }}" \
            --image "${{ steps.deployment.outputs.image }}"

      - name: Smoke test deployment
        id: smoke
        continue-on-error: true
        env:
          EXPECTED_IMAGE: ${{ steps.deployment.outputs.image }}
        run: bash scripts/smoke-test-container-app.sh

      - name: Roll back failed deployment
        if: ${{ steps.smoke.outcome == 'failure' && steps.deployment.outputs.previous_image != '' }}
        run: |
          az containerapp update \
            --resource-group "${{ env.RESOURCE_GROUP_NAME }}" \
            --name "${{ env.CONTAINER_APP_NAME }}" \
            --image "${{ steps.deployment.outputs.previous_image }}"
          bash scripts/wait-for-container-app.sh

      - name: Fail after rollback
        if: ${{ steps.smoke.outcome == 'failure' }}
        run: exit 1

      - name: Show app URL
        run: |
          APP_FQDN=$(az containerapp show \
            --resource-group "${{ env.RESOURCE_GROUP_NAME }}" \
            --name "${{ env.CONTAINER_APP_NAME }}" \
            --query properties.configuration.ingress.fqdn \
            --output tsv)
          echo "App URL: https://$APP_FQDN"
